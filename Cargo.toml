[workspace]
members = [
    "crates/crust",
    "crates/crust-mantle-adapter",
    "crates/crust-protocol",
    "crates/crust-server",
    "crates/crust-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22.1"
axum = { version = "0.8.4", features = ["ws"] }
futures-util = "0.3.31"
getrandom = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.2.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
