[workspace]
members = ["crates/crust", "crates/crust-protocol", "crates/crust-testkit"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

