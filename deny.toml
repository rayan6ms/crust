[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "Accepted P10 debt: unmaintained proc-macro-error2 is build-time-only inside Oto's private DAVE graph; no runtime code or vulnerability is admitted." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# P01 and P10 keep a measured duplicate-subsystem inventory, including the
# current Oto/OpenMLS crypto split. Version-line convergence remains an
# evidence-based budget rather than a blanket dependency-graph rejection.
multiple-versions = "allow"
# Cargo-deny's wildcard lint cannot distinguish the intentionally versionless
# workspace/local paths and exact-revision Mantle dependencies from an
# accidental wildcard. Their identities are enforced by the P01/P04/P10
# evidence checkers, while the source allowlist below remains fail-closed.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/rayan6ms/mantle"]
