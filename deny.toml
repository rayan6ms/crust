[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "Unmaintained proc-macro-error2 is build-time-only in Oto's DAVE dependency graph; revisit when upstream removes it. Runtime vulnerabilities remain denied." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Oto/OpenMLS currently require multiple crypto dependency versions.
multiple-versions = "allow"
# Workspace paths and exact-revision Git dependencies omit registry versions.
# The source allowlist below remains fail-closed.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/rayan6ms/mantle", "https://github.com/rayan6ms/oto"]
