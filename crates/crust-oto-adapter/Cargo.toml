[package]
name = "crust-oto-adapter"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
experimental-audio-worker = ["oto/experimental-audio-worker"]

[dependencies]
crust = { path = "../crust" }
futures-util.workspace = true
oto = { git = "https://github.com/rayan6ms/oto", rev = "62d2fc87e5dc239695a8b86a7372a4edc1caa933" }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
oto = { git = "https://github.com/rayan6ms/oto", rev = "62d2fc87e5dc239695a8b86a7372a4edc1caa933", features = ["testkit"] }
oto-testkit = { git = "https://github.com/rayan6ms/oto", rev = "62d2fc87e5dc239695a8b86a7372a4edc1caa933" }
serde_json.workspace = true
stats_alloc = "0.1.10"
