[package]
name = "crust-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["real-mantle", "oto-voice"]
real-mantle = ["dep:crust-mantle-adapter"]
oto-voice = ["dep:crust-oto-adapter"]

[[bin]]
name = "crust-server"
path = "src/main.rs"
required-features = ["real-mantle", "oto-voice"]

[dependencies]
axum.workspace = true
base64.workspace = true
crust = { path = "../crust" }
crust-mantle-adapter = { path = "../crust-mantle-adapter", optional = true }
crust-oto-adapter = { path = "../crust-oto-adapter", optional = true }
crust-protocol = { path = "../crust-protocol" }
futures-util.workspace = true
getrandom.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
crust-testkit = { path = "../crust-testkit" }
oto = { git = "https://github.com/rayan6ms/oto", rev = "efa16faa8a3bd472f0818f65bd89f745f6b97f6d", features = ["testkit"] }
oto-testkit = { git = "https://github.com/rayan6ms/oto", rev = "efa16faa8a3bd472f0818f65bd89f745f6b97f6d" }
tokio-tungstenite = "0.29.0"
tower.workspace = true
